   <g id="text_1">
    <text style="font-weight: 700; font-size: 16px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #263442" x="27.36" y="32.70375" transform="rotate(-0 27.36 32.70375)">证据约束的修复闭环</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10.2px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #607080" x="27.36" y="54.884859" transform="rotate(-0 27.36 54.884859)">固定开发协议；Agent 选择已注册动作，独立验收决定是否更新</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11.8px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #3a6f9d" x="41.76" y="88.027969" transform="rotate(-0 41.76 88.027969)">（a）观测与缺陷定位</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 10.7px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #3a6f9d" x="99.36" y="115.204533" transform="rotate(-0 99.36 115.204533)">当前候选 C_k</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9.3px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #607080" x="99.36" y="130.139264" transform="rotate(-0 99.36 130.139264)">资产＋证据</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 10.7px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #3a6f9d" x="255.6" y="115.531384" transform="rotate(-0 255.6 115.531384)">标准观测</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9.3px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #607080" x="255.6" y="130.163241" transform="rotate(-0 255.6 130.163241)">固定视角与来源</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 10.7px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #3a6f9d" x="411.84" y="115.199517" transform="rotate(-0 411.84 115.199517)">缺陷清单 D_k</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9.3px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #607080" x="411.84" y="130.172686" transform="rotate(-0 411.84 130.172686)">实例／区域／度量</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #3a6f9d" x="259.2" y="196.662187" transform="rotate(-0 259.2 196.662187)">（b）Agent 选择修复提案</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10.4px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #263442" x="259.2" y="215.632" transform="rotate(-0 259.2 215.632)">规则／Codex／API 只返回提案 ID 与理由</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #607080" x="259.2" y="231.325469" transform="rotate(-0 259.2 231.325469)">注册实现、版本、参数范围与预算由宿主核对</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #2a8078" x="151.2" y="284.031539" transform="rotate(-0 151.2 284.031539)">可信插件执行</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #607080" x="151.2" y="301.736" transform="rotate(-0 151.2 301.736)">任务 DAG／独立输出目录</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #2a8078" x="374.4" y="284.02525" transform="rotate(-0 374.4 284.02525)">新候选 C′</text>
   </g>
   <g id="text_16">
    <text style="font-size: 10px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #607080" x="374.4" y="301.746156" transform="rotate(-0 374.4 301.746156)">资产产物＋不可变哈希</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #786295" x="259.2" y="358.625625" transform="rotate(-0 259.2 358.625625)">（c）独立验收器重算</text>
   </g>
   <g id="text_18">
    <text style="font-size: 10.4px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #607080" x="259.2" y="379.072" transform="rotate(-0 259.2 379.072)">新进程读取冻结协议与观测 → 评分卡＋缺陷</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'Noto Sans CJK SC'; fill: #786295" transform="translate(211.95 434.620664)">必选项至少一项改善</text>
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'Noto Sans CJK SC'; fill: #786295" transform="translate(217.2 448.806328)">且无必选项退化？</text>
   </g>
   <g id="text_20">
    <text style="font-size: 10.5px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #2a8078" x="120.96" y="464.570156" transform="rotate(-0 120.96 464.570156)">是</text>
   </g>
   <g id="text_21">
    <text style="font-size: 10.5px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #607080" x="422.64" y="464.490586" transform="rotate(-0 422.64 464.490586)">否</text>
   </g>
   <g id="text_22">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #2a8078" x="108" y="503.695391" transform="rotate(-0 108 503.695391)">接受改进</text>
   </g>
   <g id="text_23">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #607080" x="410.4" y="503.666641" transform="rotate(-0 410.4 503.666641)">保留原候选</text>
   </g>
   <g id="text_24">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #ab7a31" x="259.2" y="562.2125" transform="rotate(-0 259.2 562.2125)">成功与失败均记录 Episode／Memory</text>
   </g>
   <g id="text_25">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #ab7a31" x="259.2" y="612.06707" transform="rotate(-0 259.2 612.06707)">Skill 晋升：已接受且整体通过</text>
   </g>
   <g id="text_26">
    <text style="font-size: 9.8px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #263442" x="259.2" y="630.844" transform="rotate(-0 259.2 630.844)">至少 2 个不同场景（含验证）→ 协议／插件版本匹配</text>
   </g>
   <g id="text_27">
    <text style="font-size: 9.8px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #607080" x="259.2" y="648.467313" transform="rotate(-0 259.2 648.467313)">默认不自动晋升；退化退役；不更新基础模型权重</text>
   </g>
   <g id="text_28">
    <text style="font-size: 9.3px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #ab7a31" x="476.64" y="194.362336" transform="rotate(-0 476.64 194.362336)">兼容经验</text>
   </g>
   <g id="text_29">
    <text style="font-size: 9.3px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #607080" x="259.2" y="675.660891" transform="rotate(-0 259.2 675.660891)">缺证据、无进展或超预算即停止；开发接受不等于发布授权。</text>
   </g>
