   <g id="text_1">
    <text style="font-weight: 700; font-size: 16px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #263442" x="27.36" y="32.46375" transform="rotate(-0 27.36 32.46375)">实际调用：一条命令，两种流水线</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10.2px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #607080" x="27.36" y="54.9765" transform="rotate(-0 27.36 54.9765)">箭头表示调用顺序；每个仿真阶段仍是独立 Python 子进程</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #3a6f9d" x="259.2" y="92.66082" transform="rotate(-0 259.2 92.66082)">simready.cli → workflows.pipeline_entry</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 9.4px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #3a6f9d" x="27.36" y="129.025312" transform="rotate(-0 27.36 129.025312)">--video</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 9.4px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #2a8078" x="266.4" y="127.912" transform="rotate(-0 266.4 127.912)">--scene</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #3a6f9d" x="38.16" y="154.742344" transform="rotate(-0 38.16 154.742344)">宿主  video_pipeline</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9.6px; font-family: 'Noto Sans CJK SC'; fill: #263442" transform="translate(38.16 185.0259)">video_frames.extract_frames</text>
    <text style="font-size: 9.6px; font-family: 'Noto Sans CJK SC'; fill: #263442" transform="translate(38.16 197.6109)">reconstruction_stage：复用或云任务</text>
    <text style="font-size: 9.6px; font-family: 'Noto Sans CJK SC'; fill: #263442" transform="translate(38.16 210.60465)">固化 PLY / scene-spec / input.json</text>
    <text style="font-size: 9.6px; font-family: 'Noto Sans CJK SC'; fill: #263442" transform="translate(38.16 223.53615)">VideoStages 保存可恢复回执</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #2a8078" x="277.2" y="154.742344" transform="rotate(-0 277.2 154.742344)">宿主  scene_pipeline</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9.6px; font-family: 'Noto Sans CJK SC'; fill: #263442" transform="translate(277.2 185.02065)">可选 bundle 导出 / 身份核验</text>
    <text style="font-size: 9.6px; font-family: 'Noto Sans CJK SC'; fill: #263442" transform="translate(277.2 198.41265)">写场景配置与执行计划</text>
    <text style="font-size: 9.6px; font-family: 'Noto Sans CJK SC'; fill: #263442" transform="translate(277.2 211.36815)">已有资产不触发新云重建</text>
    <text style="font-size: 9.6px; font-family: 'Noto Sans CJK SC'; fill: #263442" transform="translate(277.2 224.3379)">SSH 委派到已准备的远端 Docker</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 10.6px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #607080" x="259.2" y="278.487" transform="rotate(-0 259.2 278.487)">execution.isaac_launcher / isaac_container</text>
   </g>
   <g id="text_11">
    <text style="font-size: 9px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #607080" x="259.2" y="293.661141" transform="rotate(-0 259.2 293.661141)">显式解释器或 Docker；输入挂载、日志、退出码与启动回执</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9.2px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #607080" x="27.36" y="320.309656" transform="rotate(-0 27.36 320.309656)">执行环境中的 worker</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #3a6f9d" x="38.16" y="344.167656" transform="rotate(-0 38.16 344.167656)">video_execution.execute</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #263442" x="38.16" y="368.145" transform="rotate(-0 38.16 368.145)">输入摘要复核 → 环境检查</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 10.4px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #3a6f9d" x="138.96" y="398.242075" transform="rotate(-0 138.96 398.242075)">scene_preparation</text>
   </g>
   <g id="text_16">
    <text style="font-size: 8.6px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #607080" x="138.96" y="414.003597" transform="rotate(-0 138.96 414.003597)">分层 USD / 资产目录 / 准备记录</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #3a6f9d" x="138.96" y="459.903044" transform="rotate(-0 138.96 459.903044)">evaluation.scene_package</text>
   </g>
   <g id="text_18">
    <text style="font-size: 9px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #607080" x="138.96" y="476.156222" transform="rotate(-0 138.96 476.156222)">独立打开 USD；只做结构审计</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 10.4px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #3a6f9d" x="138.96" y="522.394075" transform="rotate(-0 138.96 522.394075)">scene_video</text>
   </g>
   <g id="text_20">
    <text style="font-size: 9px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #607080" x="138.96" y="537.989738" transform="rotate(-0 138.96 537.989738)">巡览 → 帧 / 相机 / 编码凭据</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 9.8px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #2a8078" x="277.2" y="343.774094" transform="rotate(-0 277.2 343.774094)">scene_execution.execute_scene</text>
   </g>
   <g id="text_22">
    <text style="font-size: 9.3px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #263442" x="277.2" y="367.165219" transform="rotate(-0 277.2 367.165219)">包 / 环境 → scene_delivery → 抽帧</text>
   </g>
   <g id="text_23">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #2a8078" x="290.16" y="400.33" transform="rotate(-0 290.16 400.33)">变电站：每阶段成功才继续</text>
   </g>
   <g id="text_24">
    <text style="font-size: 10.4px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #263442" x="378.72" y="426.050875" transform="rotate(-0 378.72 426.050875)">substation_mission</text>
   </g>
   <g id="text_25">
    <text style="font-size: 9.5px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #263442" x="378.72" y="460.315703" transform="rotate(-0 378.72 460.315703)">mission_audit → mission_video</text>
   </g>
   <g id="text_26">
    <text style="font-size: 8.7px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #607080" x="378.72" y="481.398914" transform="rotate(-0 378.72 481.398914)">实测轨迹          独立回放</text>
   </g>
   <g id="text_27">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #2a8078" x="378.72" y="522.4582" transform="rotate(-0 378.72 522.4582)">星巴克：cafe_video</text>
   </g>
   <g id="text_28">
    <text style="font-size: 8.8px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #607080" x="378.72" y="538.0248" transform="rotate(-0 378.72 538.0248)">G2 编排；不产生物理导航成绩</text>
   </g>
   <g id="text_29">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #607080" x="259.2" y="606.049486" transform="rotate(-0 259.2 606.049486)">宿主再次核验产物身份与交付合同 → summary.json</text>
   </g>
   <g id="text_30">
    <text style="font-size: 9.2px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #607080" x="259.2" y="623.853631" transform="rotate(-0 259.2 623.853631)">结构通过、任务通过、视频合格分别记账；文件存在不足以判成功</text>
   </g>
   <g id="text_31">
    <text style="font-size: 9.2px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #263442" x="27.36" y="659.459656" transform="rotate(-0 27.36 659.459656)">prepare-only 跳过环境检查和巡览；修复循环通过另一工作流显式启动。</text>
   </g>
  </g>
 </g>
