   <g id="text_1">
    <text style="font-weight: 700; font-size: 16px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #263442" x="27.36" y="32.78375" transform="rotate(-0 27.36 32.78375)">视频到交互 Demo：方法与交付</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10.2px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #607080" x="27.36" y="55.349438" transform="rotate(-0 27.36 55.349438)">共同来源，不同交付范围；机器人任务与场景巡览分别验收</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 12.2px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #3a6f9d" x="259.2" y="97.125191" transform="rotate(-0 259.2 97.125191)">视频观测：抽帧、清晰度与来源登记</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10.3px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #607080" x="259.2" y="115.104583" transform="rotate(-0 259.2 115.104583)">原视频＋参考帧＋文件哈希；同视频划分不构成独立测试</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9.4px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #607080" x="271.44" y="139.656406" transform="rotate(-0 271.44 139.656406)">原片输入</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 12.2px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #3a6f9d" x="259.2" y="168.838891" transform="rotate(-0 259.2 168.838891)">三维重建：空间外观底稿</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10.1px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #263442" x="259.2" y="185.527719" transform="rotate(-0 259.2 185.527719)">Aholo 原视频重建 → PLY / SPZ；服务内部训练为黑盒</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.4px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #607080" x="259.2" y="201.535594" transform="rotate(-0 259.2 201.535594)">研究支路 VGGT → gsplat：历史指标未达门槛，不替换交付底稿</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #ab7a31" x="162.36" y="257.262187" transform="rotate(-0 162.36 257.262187)">历史离线资产准备</text>
   </g>
   <g id="text_10">
