   </g>
   <g id="text_11">
    <text style="font-size: 10.6px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #263442" x="162.36" y="299.529797" transform="rotate(-0 162.36 299.529797)">纹理与几何恢复；未观测面估计</text>
