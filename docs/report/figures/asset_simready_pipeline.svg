   <g id="text_1">
    <text style="font-weight: 700; font-size: 17px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #263442" x="32.4" y="33.4775" transform="rotate(-0 32.4 33.4775)">3D 资产如何成为 SimReady 场景</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10.6px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #607080" x="32.4" y="55.476297" transform="rotate(-0 32.4 55.476297)">分离外观、接触和运动；组合为 USD，再由 Isaac Sim 执行</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #3a6f9d" x="47.52" y="89.871172" transform="rotate(-0 47.52 89.871172)">新视频输入</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.5px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #263442" x="47.52" y="109.444805" transform="rotate(-0 47.52 109.444805)">3DGS PLY＋显式场景规格</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #607080" x="317.52" y="89.898672" transform="rotate(-0 317.52 89.898672)">已有场景输入</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.5px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #263442" x="317.52" y="109.464844" transform="rotate(-0 317.52 109.464844)">经准备的 USD、网格、纹理与机器人</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #3a6f9d" x="47.52" y="162.393516" transform="rotate(-0 47.52 162.393516)">01  坐标与单位：先确定几何，再配置物理</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.5px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #263442" x="47.52" y="181.828594" transform="rotate(-0 47.52 181.828594)">高斯与派生碰撞使用源到世界变换；显式对象坐标已在世界系</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9.5px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #263442" x="47.52" y="198.055352" transform="rotate(-0 47.52 198.055352)">Z-up／每单位一米；真实尺度另需证据，姿态与关节轴显式声明</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9.3px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #607080" x="308.88" y="223.125281" transform="rotate(-0 308.88 223.125281)">同一世界系中的三种表示</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #2a8078" x="47.52" y="249.639844" transform="rotate(-0 47.52 249.639844)">02a  外观层</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9.5px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #263442" x="47.52" y="269.246953" transform="rotate(-0 47.52 269.246953)">高斯／网格／照片纹理</text>
   </g>
   <g id="text_13">
    <text style="font-size: 9.5px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #263442" x="47.52" y="285.854453" transform="rotate(-0 47.52 285.854453)">颜色、粗糙度等视觉材质</text>
   </g>
   <g id="text_14">
    <text style="font-size: 9.5px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #263442" x="47.52" y="302.372148" transform="rotate(-0 47.52 302.372148)">不把高斯当实体碰撞</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #2a8078" x="226.08" y="249.667344" transform="rotate(-0 226.08 249.667344)">02b  碰撞层</text>
   </g>
   <g id="text_16">
    <text style="font-size: 9.5px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #263442" x="226.08" y="269.29" transform="rotate(-0 226.08 269.29)">体素盒／圆柱／有限地面</text>
   </g>
   <g id="text_17">
    <text style="font-size: 9.5px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #263442" x="226.08" y="285.82625" transform="rotate(-0 226.08 285.82625)">几何形状＋CollisionAPI</text>
   </g>
   <g id="text_18">
    <text style="font-size: 9.5px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #263442" x="226.08" y="302.424102" transform="rotate(-0 226.08 302.424102)">不可见也参与接触</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #2a8078" x="404.64" y="249.771328" transform="rotate(-0 404.64 249.771328)">02c  交互对象</text>
   </g>
   <g id="text_20">
    <text style="font-size: 9.5px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #263442" x="404.64" y="269.304102" transform="rotate(-0 404.64 269.304102)">底座、帽体与局部坐标</text>
   </g>
   <g id="text_21">
    <text style="font-size: 9.5px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #263442" x="404.64" y="285.82625" transform="rotate(-0 404.64 285.82625)">刚体角色＋关节连接</text>
   </g>
   <g id="text_22">
    <text style="font-size: 9.5px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #263442" x="404.64" y="302.415195" transform="rotate(-0 404.64 302.415195)">稳定对象 ID／参数来源</text>
   </g>
   <g id="text_23">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #2a8078" x="47.52" y="364.906016" transform="rotate(-0 47.52 364.906016)">03  物理参数与运动约束</text>
   </g>
   <g id="text_24">
    <text style="font-size: 9.5px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #263442" x="47.52" y="384.148594" transform="rotate(-0 47.52 384.148594)">静态柜体：碰撞；底座：运动学刚体；按钮帽：动态刚体＋质量</text>
   </g>
   <g id="text_25">
    <text style="font-size: 9.5px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #263442" x="47.52" y="400.703398" transform="rotate(-0 47.52 400.703398)">接触材质：静摩擦 0.8／动摩擦 0.7／恢复系数 0；均为配置预设</text>
   </g>
   <g id="text_26">
    <text style="font-size: 9.5px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #263442" x="47.52" y="417.249297" transform="rotate(-0 47.52 417.249297)">滑动关节：轴与行程；力驱动：刚度、阻尼、最大力；工具接触保留</text>
   </g>
   <g id="text_27">
    <text style="font-size: 9.5px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #263442" x="47.52" y="433.823398" transform="rotate(-0 47.52 433.823398)">质量显式写入；质心与惯量未独立标定；视觉材质不自动决定摩擦</text>
   </g>
   <g id="text_28">
    <text style="font-size: 9.3px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #607080" x="308.88" y="451.383445" transform="rotate(-0 308.88 451.383445)">保存结构、关系与参数</text>
   </g>
   <g id="text_29">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #3a6f9d" x="47.52" y="476.554844" transform="rotate(-0 47.52 476.554844)">04  OpenUSD 组合：scene.usda 中的 /World</text>
   </g>
   <g id="text_30">
    <text style="font-size: 9.5px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #263442" x="47.52" y="496.145" transform="rotate(-0 47.52 496.145)">/Appearance  ← appearance.usdc     外观与源变换</text>
   </g>
   <g id="text_31">
    <text style="font-size: 9.5px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #263442" x="47.52" y="512.91875" transform="rotate(-0 47.52 512.91875)">/Collision      ← collision.usda          支撑与静态代理</text>
   </g>
   <g id="text_32">
    <text style="font-size: 9.5px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #263442" x="47.52" y="529.188555" transform="rotate(-0 47.52 529.188555)">/Objects        ← objects.usda            盒体／按钮／关节／材料</text>
   </g>
   <g id="text_33">
    <text style="font-size: 9.5px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #263442" x="47.52" y="546.000156" transform="rotate(-0 47.52 546.000156)">/Physics        → 重力 −Z、9.81 m/s²；相对引用＋资产目录＋来源摘要</text>
   </g>
   <g id="text_34">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #2a8078" x="47.52" y="601.768828" transform="rotate(-0 47.52 601.768828)">05a  新视频：加载与巡览</text>
   </g>
   <g id="text_35">
    <text style="font-size: 9.5px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #263442" x="47.52" y="620.452656" transform="rotate(-0 47.52 620.452656)">SimulationApp → USD 子层</text>
   </g>
   <g id="text_36">
    <text style="font-size: 9.5px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #263442" x="47.52" y="637.226406" transform="rotate(-0 47.52 637.226406)">相机＋Replicator → 原生视频</text>
