   <g id="text_39">
    <text style="font-size: 9.5px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #263442" x="317.52" y="621.384102" transform="rotate(-0 317.52 621.384102)">Isaac Lab → 环境＋机器人</text>
   </g>
   <g id="text_40">
    <text style="font-size: 9.5px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #263442" x="317.52" y="637.207852" transform="rotate(-0 317.52 637.207852)">关节驱动＋PhysX＋接触传感器</text>
   </g>
   <g id="text_41">
    <text style="font-size: 9.5px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #263442" x="317.52" y="654.51375" transform="rotate(-0 317.52 654.51375)">验证支撑、操作、释放与回撤</text>
   </g>
   <g id="text_42">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #786295" x="47.52" y="706.906016" transform="rotate(-0 47.52 706.906016)">06  分层验收与交付</text>
   </g>
   <g id="text_43">
    <text style="font-size: 9.5px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #263442" x="47.52" y="726.138945" transform="rotate(-0 47.52 726.138945)">结构：引用／边界／真实刚体和关节；物理：支撑／接触／行程／稳定性</text>
   </g>
   <g id="text_44">
    <text style="font-size: 9.5px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #263442" x="47.52" y="742.708594" transform="rotate(-0 47.52 742.708594)">任务：图像定位、工具接触、事件和回撤；已有变电站按 20 项审计</text>
   </g>
   <g id="text_45">
    <text style="font-size: 9.5px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #263442" x="47.52" y="759.268594" transform="rotate(-0 47.52 759.268594)">交付：分层 USD＋参数与来源＋视频／报告；各结论绑定实际验证范围</text>
   </g>
   <g id="text_46">
    <text style="font-size: 10px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #607080" x="36" y="795.795" transform="rotate(-0 36 795.795)">USD 是数据载体，SimReady 是面向用途的准备与验证；生成文件不等于任务成功。</text>
   </g>
   <g id="text_47">
    <text style="font-size: 9.5px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #607080" x="36" y="816.858945" transform="rotate(-0 36 816.858945)">当前通用入口：结构审计＋巡览；未自动辨识真实惯量、材料、电气语义或机器人任务。</text>
   </g>
