   </g>
   <g id="text_38">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #2a8078" x="317.52" y="601.7525" transform="rotate(-0 317.52 601.7525)">05b  已有任务：物理执行</text>
