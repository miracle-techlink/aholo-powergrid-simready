# ============================================================
# Aholo 黑客松提交配置 —— 唯一事实来源
# 所有提交脚本(auto_submit/login_setup/discover_endpoints)只读这个文件
# 下次比赛: 复制整个 submission/ 目录,改 meta 与 links 即可
# ============================================================
meta:
  contest: "群核科技 Aholo 全球 3D AI 黑客松"
  activity_code: "aholo-hackathon-2026"     # activity/config API 的 code
  base_url: "https://www.aholo3d.cn"
  my_page: "https://www.aholo3d.cn/hackathon/my"
  deadline: "2026-11-19 19:00 +08:00"       # 已由 API 时间戳证实 close=1795086000000
  team_max_members: 3

project:
  title: "配电房分合闸:Real2Sim 自修复场景中的带臂四足巡检"
  tagline: "真实配电房视频 → 3DGS 重建 → RSI 自修复 → Lite3+Z1 巡检按分合闸;任务走通=重建验收"
  # 选题提交可能要的 200 字简介
  abstract: >
    一段 91 秒真实配电房一镜到底视频,经 SfM+3DGS 重建为可仿真场景;RSI 闭环自动
    检测并修复重建缺陷(空洞/漂浮物/色污),修复验收不靠 PSNR 而靠下游任务可用性;
    Lite3 四足搭载 Z1 臂在修复后场景中巡检开关柜排并执行分合闸按钮操作。
    全程 skill 沉淀跨 trial 复用。

# ---- 必交 ----
required:
  report:                       # 必交1: 项目报告书
    source: "report/报告书_主文档.md"     # latex-cn-report skill 排版成 PDF
    pdf: "report/报告书.pdf"             # build 后生成
    requirements:              # 官方原文要求
      - "完整记录从创意到成果的过程"
      - "含过程截图"
      - "关键资产迭代对比或关键效果截图"
  demo:                         # 必交2: 完整 Demo(链接或视频),必须含真实运行画面
    video: "../deliver/final_4min.mp4"   # video-edit skill 组装,4 分钟成片
    fallback_links: []          # 可运行链接(魔搭/GitHub Pages)有则填
    must_show:                  # 自检: 成片必须出现
      - "真实输入视频画面"
      - "重建/修复过程真实运行画面(终端+渲染)"
      - "狗+臂执行任务画面"

# ---- 加分 ----
bonus:
  xiaohongshu:                  # 加分1: 小红书 #Aholo黑客松,结果公布前保持公开
    link: ""                    # 发布后回填
    hashtag: "#Aholo黑客松"
  source_code:                  # 加分2: 源代码
    repo: ""                    # 公开 repo 链接(建好后回填)
    zip: "package/source_code.zip"
  modelscope:                   # 魔搭社区发布 → 20h GPU 额度
    link: ""

# ---- 硬性合规 ----
compliance:
  must_use_aholo_lux3d: true    # ⚠️ 官方硬性要求: 作品必须使用 Aholo Lux3D 且承担核心 3D 流程
  lux3d_usage: "配电房柜体/按钮资产经 Lux3D img-to-3d 生成并接入场景(aholo_client.py,待 API Key 实拍图跑通)"
  aholo_client: "/home/nvidia/graduation_material/hackathon_pipeline/scripts/aholo_client.py"
  api_key_env: "AHOLO_API_KEY"  # 仍待用户提供

# ---- 自动化 ----
automation:
  storage_state: "auth/storage_state.json"   # login_setup.py 产出
  endpoints: "auth/endpoints.json"           # discover_endpoints.py 产出
  screenshots_dir: "runs"                    # 每次运行的截图/日志
