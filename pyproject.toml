[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "simready-pipeline"
version = "0.3.0"
description = "Bounded agent repair campaigns, reusable memory and skills, and evidence-bound scene evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
benchmark = ["numpy>=1.24", "scipy>=1.10", "Pillow>=9.1"]
ingest = ["numpy>=1.24", "Pillow>=9.1"]
test = ["pytest>=7", "numpy>=1.24", "scipy>=1.10", "Pillow>=9.1", "scikit-image>=0.20"]
dev = ["build>=1", "ruff==0.17.4"]

[project.scripts]
simready-infra = "simready_bridge.infra.__main__:main"
simready-benchmark = "simready_bridge.benchmark.__main__:main"
simready-pipeline = "simready_bridge.pipeline.__main__:main"
simready-ingest = "simready_bridge.ingest.__main__:main"

[tool.setuptools.packages.find]
include = ["simready_bridge*"]

[tool.pytest.ini_options]
testpaths = ["tests", "legacy/scene_bench"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F", "I"]
