name: portable-tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test,dev]'
      - run: ruff check simready_bridge tests examples scripts
      - run: ruff check legacy --select E9,F63,F7,F82
      - run: ruff format --check simready_bridge tests examples scripts legacy
      - run: python -m pytest -q
      - run: python -m compileall -q simready_bridge examples scripts legacy
      - run: python -m build
      - run: simready-pipeline --help && simready-ingest --help
