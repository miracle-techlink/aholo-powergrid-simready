name: portable-tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test,dev]'
      - run: ruff check src/simready tests examples scripts deploy
      - run: ruff check legacy --select E9,F63,F7,F82
      - run: ruff format --check src/simready tests examples scripts legacy deploy
      - run: python scripts/check_architecture.py
      - run: python -m pytest -q
      - run: python -m compileall -q src/simready examples scripts legacy deploy
      - run: python -m build
      - run: simready --help
      - run: simready run --help
      - run: simready simulation --help
      - run: simready workflows --help
      - run: simready evaluation --help
