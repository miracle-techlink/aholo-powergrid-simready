name: portable-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUNBUFFERED: '1'

jobs:
  static:
    name: static-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install '.[dev]'
      - name: Lint and architecture
        run: |
          ruff check src/simready tests examples scripts deploy
          ruff check legacy --select E9,F63,F7,F82
          ruff format --check src/simready tests examples scripts legacy deploy
          python scripts/check_architecture.py
          python -m compileall -q src/simready examples scripts legacy deploy
      - name: Validate workflow syntax and expressions
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl --fail --location --retry 3 --max-time 120 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  test:
    name: cpu-tests (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python -m pip install '.[test,physical-assets]'
          python -c 'from pxr import Usd; print(Usd.GetVersion())'
          ffmpeg -version
          mkdir -p ci-results
          python -m pip freeze > ci-results/environment.txt
      - name: Full CPU regression
        run: python -m pytest -q --junitxml=ci-results/pytest.xml
      - name: Preserve test evidence, including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cpu-tests-${{ matrix.python }}-${{ github.sha }}
          path: ci-results/
          if-no-files-found: warn
          retention-days: 14

  package:
    name: package-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build and check distribution
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python -m pip install '.[dev]' twine
          python -m build
          python -m twine check dist/*
      - name: Install wheel in an isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          wheel_files=(dist/*.whl)
          test "${#wheel_files[@]}" -eq 1
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install "${wheel_files[0]}[physical-assets]"
      - name: Exercise installed CLI and real CPU pipeline outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          wheel_python="$RUNNER_TEMP/wheel-env/bin/python"
          "$wheel_python" -I -c 'import pathlib, simready, sys; assert pathlib.Path(simready.__file__).is_relative_to(sys.prefix)'
          for domain in run simulation workflows evaluation; do
            "$wheel_python" -I -m simready "$domain" --help
          done
          "$wheel_python" -I "$GITHUB_WORKSPACE/examples/pipeline/create_fixture.py" --out "$RUNNER_TEMP/pipeline-inputs"
          "$wheel_python" -I -m simready run --pipeline "$RUNNER_TEMP/pipeline-inputs/pipeline.json" --out "$RUNNER_TEMP/pipeline-run"
          "$wheel_python" -I -m simready run --pipeline "$RUNNER_TEMP/pipeline-inputs/pipeline.json" --out "$RUNNER_TEMP/pipeline-run" --resume
          "$wheel_python" -I - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ['RUNNER_TEMP']) / 'pipeline-run/summary.json').read_text())
          assert result['status'] == 'COMPLETE', result
          assert result['physical_asset_validation'] == 'PASS', result
          assert result['task_validated'] is False, result
          assert all(stage['reused'] for stage in result['stages']), result
          PY
      - name: Bind package and smoke evidence to this commit
        env:
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cp "$RUNNER_TEMP/pipeline-run/summary.json" dist/cpu-smoke.json
          python - <<'PY'
          import json, os, platform
          from pathlib import Path
          Path('dist/manifest.json').write_text(json.dumps({
              'commit': os.environ['COMMIT_SHA'],
              'run_url': os.environ['RUN_URL'],
              'python': platform.python_version(),
              'validation_scope': 'CPU contracts and installed wheel; no model or GPU validation',
          }, indent=2) + '\n')
          PY
          (cd dist && sha256sum ./* > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-candidate-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  gate:
    name: merge-gate
    if: ${{ always() }}
    needs: [static, test, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require every dependency to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/check_ci_gate.py

  delivery:
    name: main-artifacts
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [gate, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package-candidate-${{ github.sha }}
          path: delivery
      - name: Verify tested package bytes
        working-directory: delivery
        run: sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: main-package-${{ github.sha }}
          path: delivery/
          if-no-files-found: error
          retention-days: 30
